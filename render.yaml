services:
  - type: web
    name: boardingedu-crm
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        value: BoardingEdu123@gmail.com
      - key: ADMIN_OTP_EMAIL
        value: BoardingEdu123@gmail.com
      - key: ADMIN_REQUIRE_LOGIN_OTP
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: adminboarding123@gmail.com
      - key: SMTP_PASS
        value: zdvnmezemiytftec
      - key: SMTP_FROM
        value: BoardingEdu CRM <adminboarding123@gmail.com>

